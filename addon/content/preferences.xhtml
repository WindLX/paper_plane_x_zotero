<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
  <html:link rel="stylesheet" href="chrome://__addonRef__/content/ui.css" />
  <html:link
    rel="stylesheet"
    href="chrome://__addonRef__/content/preferences.css"
  />
</linkset>
<groupbox
  class="ppx-pref-shell ppx-ui-root"
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <html:div class="ppx-pref-card ppx-ui-card">
    <html:div class="ppx-pref-header">
      <html:div class="ppx-pref-title-row">
        <html:span class="ppx-pref-title-icon" aria-hidden="true">
          <html:img
            src="chrome://__addonRef__/content/icons/favicon.svg"
            alt=""
          />
        </html:span>
        <html:h2 data-l10n-id="pref-title"></html:h2>
      </html:div>
      <html:p data-l10n-id="pref-description"></html:p>
    </html:div>

    <html:div class="ppx-pref-row">
      <html:label
        class="ppx-pref-label"
        for="zotero-prefpane-__addonRef__-paperPlaneBaseURL"
        data-l10n-id="pref-paperplane-base-url"
      ></html:label>
      <html:input
        class="ppx-pref-input ppx-ui-input"
        type="text"
        id="zotero-prefpane-__addonRef__-paperPlaneBaseURL"
        preference="paperPlaneBaseURL"
        data-pref-key="paperPlaneBaseURL"
      ></html:input>
      <html:p
        class="ppx-pref-hint"
        data-l10n-id="pref-paperplane-base-url-hint"
      ></html:p>
    </html:div>
  </html:div>
</groupbox>
